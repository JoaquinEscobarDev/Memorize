<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Juego de Memoria</title>
    <link rel="stylesheet" href="./style/memorize.css" />
</head>

<body>
    <!-- Vista del juego -->
    <div id="game" class="view active">
        <div class="buttons">
            <button onclick="goHome()">🏠</button>
            <button onclick="startGame()">🔄</button>
            <button onclick="showEndScreen()" class="demo-button">🎯</button> <!-- Nuevo botón de demo -->
        </div>        
        <div class="game" id="board"></div>
    </div>

 <!-- Vista de fin del juego -->
<div id="endScreen" class="view" style="display: none;">
    <h2>¿Quieres jugar de nuevo?</h2>
    <div class="logo-container">
        <img src="./style/assets/logoCarta.jpeg" alt="Logo" class="logo-finish">
        <button class="restart-button" onclick="goBack()">🔄</button> <!-- Ahora llama a goBack() -->
    </div>
</div>


    <script src="./js/memorize.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            startGame();
        });
    </script>

    <audio id="clickSound" src="./style/sound/card.mp3" preload="auto"></audio>
    <audio id="victorySound" src="./style/sound/victory.mp3" preload="auto"></audio>
</body>


</html>
